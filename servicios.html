<!DOCTYPE html>
<html lang="en">
<head>

   <div id="footer"></div>

    <script>

async function loadComponents(){

    const navbar = await fetch("components/navbar.html");
    const navbarData = await navbar.text();

    document.getElementById("footer").innerHTML = footerData;
}

loadComponents();

</script>
